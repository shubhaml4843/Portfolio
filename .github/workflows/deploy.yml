name: Deploy portfolio to GitHub Pages

# Builds the CRA app and publishes it straight to Pages. This replaces the
# "deploy from a branch" setup, so there is no gh-pages branch to keep in
# sync and no branch/folder selection to get wrong.
on:
  push:
    branches: [shubham-dev, developement]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # CI=true would promote lint warnings to errors and fail the build.
        env:
          CI: false
        run: npm run build

      - name: Disable Jekyll processing
        run: touch build/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
