<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Agent-graph mark: an orchestrator node linked to three worker agents.
       Kept to four nodes so it stays readable at 16px. -->
  <defs>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="55%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="#05070F"/>

  <g stroke="#22D3EE" stroke-opacity="0.55" stroke-width="2.6" stroke-linecap="round">
    <line x1="32" y1="32" x2="16" y2="16"/>
    <line x1="32" y1="32" x2="49" y2="20"/>
    <line x1="32" y1="32" x2="24" y2="50"/>
  </g>

  <circle cx="16" cy="16" r="5.4" fill="#22D3EE"/>
  <circle cx="49" cy="20" r="4.8" fill="#67E8F9"/>
  <circle cx="24" cy="50" r="4.8" fill="#34D399"/>

  <circle cx="32" cy="32" r="10.5" fill="url(#core)"/>
  <circle cx="32" cy="32" r="10.5" fill="none" stroke="#E5EDFF" stroke-opacity="0.28" stroke-width="1.6"/>
</svg>
